services:
  postgres:
    image: postgres:16
    container_name: url_shortener_postgres
    restart: always
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: url_shortener
    volumes:
      - postgres_data:/var/lib/postgresql/data
  redis: 
    image: redis:7
    container_name: url_shortener_redis
    restart: always
    ports:
      - "6379:6379"
volumes:
  postgres_data: